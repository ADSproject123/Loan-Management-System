name: Supabase keep-alive

on:
  schedule:
    # Every 12 hours - well under the free-tier auto-pause window.
    - cron: '0 */12 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        run: |
          curl --fail-with-body -sS -X GET "${APP_URL}/api/cron/keep-alive" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
